name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the output to GitHub Pages
        type: choice
        required: true
        default: 'true'
        options:
          - true
          - false

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push-image-and-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get lowercase repository name
        id: repo_name
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}:latest
          build-args: |
            WASM_DEBUG=sourcemap
            WASM_SOURCEMAP_BASE=/playground/
          # Export both as a container image and in the out directory
          outputs: |
            type=docker
            out

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.repo_name.outputs.lowercase }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Prepare pages artifact
        run: tar --dereference --hard-dereference -cf github-pages.tar --directory out/www .

      - name: Upload pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: github-pages.tar
          if-no-files-found: error

      - name: Deploy
        id: deployment
        if: ${{ github.event.inputs.deploy == 'true' }}
        uses: actions/deploy-pages@v5

  build-cosmo-exe:
    runs-on: ubuntu-latest
    needs: build-push-image-and-publish
    permissions:
      contents: write
    steps:
      - name: Checkout cosmopolitan
        uses: actions/checkout@v6
        with:
          repository: jart/cosmopolitan

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: github-pages

      - name: Build redbean
        run: |
          sudo cp build/bootstrap/ape.elf /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"
          make -j$(nproc) MODE=tiny o/tiny/tool/net/redbean
          mv o/tiny/tool/net/redbean lite-xl-playground.com

      - name: Build cosmopolitan executable
        run: |
          cd github-pages
          tar -xf github-pages.tar
          rm -rf subprojects github-pages.tar
          echo "LaunchBrowser()" > .init.lua
          zip -9ur ../lite-xl-playground.com ./

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          commit: ${{ github.sha }}
          artifacts: lite-xl-playground.com
          prerelease: true
          allowUpdates: true
          generateReleaseNotes: true
